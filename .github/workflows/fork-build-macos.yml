name: Fork Build macOS

# Fork-friendly macOS build workflow. Produces an unsigned / ad-hoc-signed
# Ghostty.app zipped as a workflow artifact you can download from the run.
# First launch on macOS: right-click -> Open, or run
#   xattr -dr com.apple.quarantine /Applications/Ghostty.app
# to clear the quarantine attribute.
#
# Build is split across two runners because of a trilemma:
#   * Xcode 16.x: missing Tahoe-SDK types (ConcentricRectangle, NSGlassEffectView)
#   * Xcode 26.x on macos-15: ibtoold crashes compiling Assets.xcassets
#   * Xcode 26.x on macos-26: Zig 0.15.2 cannot link against the Tahoe libSystem
# So: build GhosttyKit.xcframework on macos-15 (Zig OK there), then build the
# native app on macos-26 using Xcode 26 with the prebuilt framework.

on:
  workflow_dispatch: {}
  push:
    branches:
      - "middle-click-paste-sync*"

concurrency:
  group: fork-build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  GHOSTTY_VERSION: 1.3.1-middle-click-paste-sync

jobs:
  build-ghostty-kit:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build GhosttyKit.xcframework
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          zig build \
            -Doptimize=ReleaseFast \
            -Demit-macos-app=false \
            -Dversion-string="${GHOSTTY_VERSION}"

      - name: Archive framework
        run: |
          cd macos
          tar -czf ../GhosttyKit.xcframework.tgz GhosttyKit.xcframework

      - name: Upload framework artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-kit-xcframework
          path: GhosttyKit.xcframework.tgz
          if-no-files-found: error

  build-app:
    needs: build-ghostty-kit
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract build info
        id: build_info
        run: |
          GHOSTTY_BUILD=$(git rev-list --count HEAD)
          GHOSTTY_COMMIT=$(git rev-parse --short HEAD)
          echo "build=$GHOSTTY_BUILD" >> "$GITHUB_OUTPUT"
          echo "commit=$GHOSTTY_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Select Xcode
        run: |
          # Use the newest Xcode 26.x available; macos-26 ships it by default.
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            XCODE_PATH=/Applications/Xcode.app
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Download framework artifact
        uses: actions/download-artifact@v4
        with:
          name: ghostty-kit-xcframework
          path: .

      - name: Extract framework
        run: |
          tar -xzf GhosttyKit.xcframework.tgz -C macos
          test -d macos/GhosttyKit.xcframework

      - name: Setup Sparkle
        env:
          SPARKLE_VERSION: 2.9.0
        run: |
          mkdir -p .action/sparkle
          cd .action/sparkle
          curl -L "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" -o sparkle.zip
          unzip -q sparkle.zip
          echo "$(pwd)/bin" >> "$GITHUB_PATH"

      # Build Ghostty.app with xcodebuild. Ad-hoc sign (CODE_SIGN_IDENTITY="-")
      # so we do not need an Apple Developer certificate.
      - name: Build Ghostty.app
        run: |
          cd macos
          xcodebuild \
            -target Ghostty \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_CODE_SIGN_FLAGS="--deep"

      - name: Stamp Info.plist
        env:
          GHOSTTY_BUILD: ${{ steps.build_info.outputs.build }}
          GHOSTTY_COMMIT: ${{ steps.build_info.outputs.commit }}
        run: |
          PLIST="macos/build/Release/Ghostty.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :GhosttyCommit $GHOSTTY_COMMIT" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GHOSTTY_BUILD" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $GHOSTTY_VERSION" "$PLIST" || true

      - name: Ad-hoc sign app bundle
        run: |
          /usr/bin/codesign --force --deep --sign - \
            --entitlements macos/Ghostty.entitlements \
            macos/build/Release/Ghostty.app

      - name: Zip App
        run: |
          cd macos/build/Release
          zip -9 -r --symlinks ../../../ghostty-macos-universal.zip Ghostty.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-macos-universal
          path: ghostty-macos-universal.zip
          if-no-files-found: error
